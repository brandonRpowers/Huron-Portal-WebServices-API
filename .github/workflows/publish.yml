name: Publish NuGet package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
          source-url: https://nuget.pkg.github.com/brandonRpowers/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore ./PortalAPI/PortalAPI.csproj

      - name: Build
        run: dotnet build ./PortalAPI/PortalAPI.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack ./PortalAPI/PortalAPI.csproj -c Release --no-build -o ./nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/brandonRpowers/index.json" --skip-duplicate
